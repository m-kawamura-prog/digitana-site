<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="本棚を撮影して蔵書リストを作るAndroidアプリ「デジたな」の公式サイトです。">
  <title>デジたな</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="./">デジたな</a>
      <nav aria-label="主要ナビゲーション">
        <a href="privacy/">プライバシーポリシー</a>
        <a href="support/">サポート</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <p class="eyebrow">本棚を、デジタルに。</p>
      <h1>本棚を撮るだけで、<br>蔵書リストに。</h1>
      <p class="lead">
        デジたなは、本棚の写真から書籍候補を読み取り、書誌情報と照合して蔵書を整理するAndroidアプリです。
      </p>
    </section>

    <section class="wrap grid" aria-label="主な機能">
      <article class="card">
        <h2>本棚を撮影</h2>
        <p>背表紙をAIで読み取り、複数冊の登録候補をまとめて作成します。</p>
      </article>
      <article class="card">
        <h2>蔵書を整理</h2>
        <p>本棚・著者・出版社などから、登録した本を端末内で管理できます。</p>
      </article>
      <article class="card">
        <h2>次に読む本を探す</h2>
        <p>蔵書や読書嗜好をもとに、オススメや新刊候補を探せます。</p>
      </article>
    </section>

    <section class="wrap notice">
      <h2>公開準備中</h2>
      <p>現在、Google Playでの公開に向けて準備を進めています。</p>
    </section>
  </main>

  <footer>
    <div class="wrap footer-links">
      <span>© 2026 デジたな</span>
      <a href="privacy/">プライバシーポリシー</a>
      <a href="support/">サポート</a>
    </div>
  </footer>
</body>
</html>
